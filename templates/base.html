<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RAG Research Explorer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('pages.index') }}">RAG <span>Research Explorer</span></a>
    <nav>
      <a class="{% if request.endpoint in ['pages.index', 'pages.search_page'] %}active{% endif %}"
         href="{{ url_for('pages.index') }}">Search</a>
      <a class="{% if request.endpoint == 'pages.research_overview' %}active{% endif %}"
         href="{{ url_for('pages.research_overview') }}">Overview</a>
      <a class="{% if request.endpoint in ['pages.collections_list', 'pages.collection_detail'] %}active{% endif %}"
         href="{{ url_for('pages.collections_list') }}">Collections</a>
      <a class="{% if request.endpoint == 'pages.analytics' %}active{% endif %}"
         href="{{ url_for('pages.analytics') }}">Analytics</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Local research explorer · BM25 over SQLite FTS5 · data source: OpenAlex
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
